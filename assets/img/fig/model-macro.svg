<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Macroscopic model: density waves, not individuals"><title>Macroscopic model: density waves, not individuals</title><style>.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.wall{fill:var(--ink,#14283a)}.cell{fill:none;stroke:var(--line,#d5dde3);stroke-width:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text class="fg-h" x="24" y="34">Macroscopic model: density waves, not individuals</text><text class="fg-s" x="24" y="54">Conservation of people plus a fundamental diagram; fast enough for whole sites</text><defs><linearGradient id="mg" x1="0" x2="1"><stop offset="0" stop-color="var(--climate,#7a4412)" stop-opacity=".85"><animate attributeName="offset" values="0;0.6;0" dur="6s" repeatCount="indefinite"/></stop><stop offset="0.5" stop-color="var(--energy,#0b3954)" stop-opacity=".35"><animate attributeName="offset" values="0.3;0.9;0.3" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="var(--energy,#0b3954)" stop-opacity=".08"/></linearGradient></defs><rect x="80" y="100" width="720" height="140" rx="8" fill="url(#mg)"/><rect class="wall" x="80" y="94" width="720" height="6"/><rect class="wall" x="80" y="240" width="720" height="6"/><line x1="300" y1="92" x2="300" y2="250" stroke="var(--ink,#14283a)" stroke-width="3" stroke-dasharray="6 6"><animate attributeName="x1" values="200;520;200" dur="6s" repeatCount="indefinite"/><animate attributeName="x2" values="200;520;200" dur="6s" repeatCount="indefinite"/></line><text class="fg-t" x="80" y="290">density ρ(x, t): dark = dense. The dashed line is a queue front (shock wave).</text><text class="fg-t" x="80" y="314">∂ρ/∂t + ∂(ρ·v(ρ))/∂x = 0, with v(ρ) from the fundamental diagram</text></svg>