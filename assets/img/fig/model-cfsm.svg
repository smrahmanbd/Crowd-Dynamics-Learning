<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Collision-free speed model: keep a safe time gap"><title>Collision-free speed model: keep a safe time gap</title><style>.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.wall{fill:var(--ink,#14283a)}.cell{fill:none;stroke:var(--line,#d5dde3);stroke-width:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text class="fg-h" x="24" y="34">Collision-free speed model: keep a safe time gap</text><text class="fg-s" x="24" y="54">First-order, few parameters, overlap-free; JuPedSim's default model</text><circle cx="330" cy="205" r="120" fill="none" stroke="var(--line,#d5dde3)" stroke-width="28"/><circle r="9" fill="var(--energy,#0b3954)"><animateMotion path="M450,205 A120,120 0 1 1 449.99,204.5" dur="12s" begin="0.00s" repeatCount="indefinite" keyPoints="0;0.3;0.38;1" keyTimes="0;0.4;0.6;1" calcMode="linear"/></circle><circle r="9" fill="var(--energy,#0b3954)"><animateMotion path="M450,205 A120,120 0 1 1 449.99,204.5" dur="12s" begin="-0.86s" repeatCount="indefinite" keyPoints="0;0.3;0.38;1" keyTimes="0;0.4;0.6;1" calcMode="linear"/></circle><circle r="9" fill="var(--energy,#0b3954)"><animateMotion path="M450,205 A120,120 0 1 1 449.99,204.5" dur="12s" begin="-1.71s" repeatCount="indefinite" keyPoints="0;0.3;0.38;1" keyTimes="0;0.4;0.6;1" calcMode="linear"/></circle><circle r="9" fill="var(--energy,#0b3954)"><animateMotion path="M450,205 A120,120 0 1 1 449.99,204.5" dur="12s" begin="-2.57s" repeatCount="indefinite" keyPoints="0;0.3;0.38;1" keyTimes="0;0.4;0.6;1" calcMode="linear"/></circle><circle r="9" fill="var(--energy,#0b3954)"><animateMotion path="M450,205 A120,120 0 1 1 449.99,204.5" dur="12s" begin="-3.43s" repeatCount="indefinite" keyPoints="0;0.3;0.38;1" keyTimes="0;0.4;0.6;1" calcMode="linear"/></circle><circle r="9" fill="var(--energy,#0b3954)"><animateMotion path="M450,205 A120,120 0 1 1 449.99,204.5" dur="12s" begin="-4.29s" repeatCount="indefinite" keyPoints="0;0.3;0.38;1" keyTimes="0;0.4;0.6;1" calcMode="linear"/></circle><circle r="9" fill="var(--energy,#0b3954)"><animateMotion path="M450,205 A120,120 0 1 1 449.99,204.5" dur="12s" begin="-5.14s" repeatCount="indefinite" keyPoints="0;0.3;0.38;1" keyTimes="0;0.4;0.6;1" calcMode="linear"/></circle><circle r="9" fill="var(--energy,#0b3954)"><animateMotion path="M450,205 A120,120 0 1 1 449.99,204.5" dur="12s" begin="-6.00s" repeatCount="indefinite" keyPoints="0;0.3;0.38;1" keyTimes="0;0.4;0.6;1" calcMode="linear"/></circle><circle r="9" fill="var(--energy,#0b3954)"><animateMotion path="M450,205 A120,120 0 1 1 449.99,204.5" dur="12s" begin="-6.86s" repeatCount="indefinite" keyPoints="0;0.3;0.38;1" keyTimes="0;0.4;0.6;1" calcMode="linear"/></circle><circle r="9" fill="var(--energy,#0b3954)"><animateMotion path="M450,205 A120,120 0 1 1 449.99,204.5" dur="12s" begin="-7.71s" repeatCount="indefinite" keyPoints="0;0.3;0.38;1" keyTimes="0;0.4;0.6;1" calcMode="linear"/></circle><circle r="9" fill="var(--energy,#0b3954)"><animateMotion path="M450,205 A120,120 0 1 1 449.99,204.5" dur="12s" begin="-8.57s" repeatCount="indefinite" keyPoints="0;0.3;0.38;1" keyTimes="0;0.4;0.6;1" calcMode="linear"/></circle><circle r="9" fill="var(--energy,#0b3954)"><animateMotion path="M450,205 A120,120 0 1 1 449.99,204.5" dur="12s" begin="-9.43s" repeatCount="indefinite" keyPoints="0;0.3;0.38;1" keyTimes="0;0.4;0.6;1" calcMode="linear"/></circle><circle r="9" fill="var(--energy,#0b3954)"><animateMotion path="M450,205 A120,120 0 1 1 449.99,204.5" dur="12s" begin="-10.29s" repeatCount="indefinite" keyPoints="0;0.3;0.38;1" keyTimes="0;0.4;0.6;1" calcMode="linear"/></circle><circle r="9" fill="var(--energy,#0b3954)"><animateMotion path="M450,205 A120,120 0 1 1 449.99,204.5" dur="12s" begin="-11.14s" repeatCount="indefinite" keyPoints="0;0.3;0.38;1" keyTimes="0;0.4;0.6;1" calcMode="linear"/></circle><text class="fg-t" x="520" y="120">speed = min(v0, (s − ℓ) ÷ T)</text><text class="fg-s" x="520" y="146">s: distance to the person in front</text><text class="fg-s" x="520" y="166">ℓ: body size; T: time gap</text><text class="fg-t" x="520" y="210">Never closer than the time gap,</text><text class="fg-t" x="520" y="234">so people never collide.</text><text class="fg-s" x="520" y="268">Slow-downs travel backwards as stop-and-go waves.</text></svg>