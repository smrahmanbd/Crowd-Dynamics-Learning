<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cognitive heuristics: look, then choose a free direction"><title>Cognitive heuristics: look, then choose a free direction</title><style>.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.wall{fill:var(--ink,#14283a)}.cell{fill:none;stroke:var(--line,#d5dde3);stroke-width:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text class="fg-h" x="24" y="34">Cognitive heuristics: look, then choose a free direction</text><text class="fg-s" x="24" y="54">Vision-based decisions (Moussaïd et al. 2011); turbulence with contact forces</text><rect x="560" y="120" width="40" height="70" rx="6" fill="var(--climate,#7a4412)" opacity=".7"/><text class="fg-s" x="548" y="110">obstacle</text><circle cx="820" cy="180" r="12" fill="none" stroke="var(--land,#2f5a1c)" stroke-width="3"/><text class="fg-s" x="795" y="215">goal</text><g><animateTransform attributeName="transform" type="translate" values="0,0;250,0;360,70;470,60;560,10" keyTimes="0;0.35;0.6;0.8;1" dur="8s" repeatCount="indefinite"/><path d="M200,180 L370,90 A190,190 0 0 1 370,270 Z" fill="var(--water,#04505a)" opacity=".14"><animateTransform attributeName="transform" type="rotate" values="-12 200 180;12 200 180;-12 200 180" dur="2s" repeatCount="indefinite"/></path><line x1="200" y1="180" x2="330" y2="180" stroke="var(--water,#04505a)" stroke-width="3" stroke-dasharray="6 5"/><circle cx="200" cy="180" r="11" fill="var(--ink,#14283a)"/></g><text class="fg-t" x="80" y="310">Heuristic 1: head where you can walk furthest towards the goal without a collision.</text><text class="fg-t" x="80" y="334">Heuristic 2: keep a safe time to collision with what is ahead.</text></svg>